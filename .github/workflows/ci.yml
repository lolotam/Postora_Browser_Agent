name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end (extension in Chromium with mock models)
        run: npm run e2e
      - name: Build the store package
        run: npm run package
      - name: Unpack the store package
        run: unzip -q dist/postora-browser-agent-v*.zip -d "$RUNNER_TEMP/postora-store"
      - name: End-to-end (packaged extension with mock models)
        run: npm run e2e
        env:
          E2E_EXTENSION_DIR: ${{ runner.temp }}/postora-store

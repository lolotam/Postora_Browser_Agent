name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end (extension in Chromium with mock models)
        run: npm run e2e
      - name: Build the store package
        run: npm run package
      - name: Unpack the store package
        run: unzip -q dist/postora-browser-agent-v*.zip -d "$RUNNER_TEMP/postora-store"
      - name: End-to-end (packaged extension with mock models)
        run: npm run e2e
        env:
          E2E_EXTENSION_DIR: ${{ runner.temp }}/postora-store

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release packages
        run: |
          npm run package
          npm run package:private
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" "dist/postora-browser-agent-v$VERSION.zip" "dist/postora-private-v$VERSION.zip" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              "dist/postora-browser-agent-v$VERSION.zip" \
              "dist/postora-private-v$VERSION.zip" \
              --title "v$VERSION" \
              --generate-notes
          fi

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Windows runtime artifacts for packaging
        run: |
          npm install --force --no-save @transcribe-cpp/win32-x64-cpu-vulkan@0.4.2
          npm install --force --no-save "@koromix/koffi-win32-x64@$(node -p "require('koffi/package.json').version")"
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end (extension in Chromium with mock models)
        run: npm run e2e
      - name: Build the store package
        run: npm run package
      - name: Build the private package
        run: npm run package:private
      - name: Unpack the store package
        run: unzip -q dist/postora-browser-agent-v*.zip -d "$RUNNER_TEMP/postora-store"
      - name: End-to-end (packaged extension with mock models)
        run: npm run e2e
        env:
          E2E_EXTENSION_DIR: ${{ runner.temp }}/postora-store

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Windows runtime artifacts for packaging
        run: |
          npm install --force --no-save @transcribe-cpp/win32-x64-cpu-vulkan@0.4.2
          npm install --force --no-save "@koromix/koffi-win32-x64@$(node -p "require('koffi/package.json').version")"
      - name: Build release packages
        run: |
          npm run package
          npm run package:private
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists for this version. Skipping release creation."
          else
            echo "Creating new release $TAG at ${{ github.sha }}..."
            gh release create "$TAG" \
              "dist/postora-browser-agent-v$VERSION.zip" \
              "dist/postora-private-v$VERSION.zip" \
              --target "${{ github.sha }}" \
              --title "v$VERSION" \
              --generate-notes
          fi

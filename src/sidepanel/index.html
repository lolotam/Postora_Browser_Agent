<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Postora Browser Agent</title>
  <link rel="icon" href="../../icons/icon-32.png" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img class="logo" src="../../icons/logo.png" alt="" width="22" height="22" />
      <button type="button" class="session-btn" id="sessionBtn" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="session.open">
        <span id="sessionTitle" dir="auto"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
      </button>
      <span class="dot" id="statusDot"></span>
    </div>
    <span class="chip" id="modelChip" dir="ltr">—</span>
    <div class="actions">
      <button type="button" class="ghost icon account-btn" id="accountBtn" aria-haspopup="dialog" data-i18n-title="account.open">
        <img class="avatar" id="accountAvatar" alt="" referrerpolicy="no-referrer" hidden />
        <svg id="accountIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" /></svg>
      </button>
      <button type="button" class="ghost lang" id="langBtn" data-i18n="lang.switchLabel" data-i18n-title="lang.switchTitle">ع</button>
      <button type="button" class="ghost icon" id="feedbackBtn" aria-haspopup="dialog" data-i18n-title="feedback.open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /><path d="M8 9h8M8 12h5" /></svg>
      </button>
      <button type="button" class="ghost icon" id="newChatBtn" data-i18n-title="header.newChat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <button type="button" class="ghost icon" id="settingsBtn" data-i18n-title="header.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
      </button>
    </div>
  </header>
  <div id="sessionMenu" class="session-menu" hidden>
    <input id="sessionSearch" type="search" autocomplete="off" data-i18n-placeholder="session.search" />
    <ul id="sessionList" role="listbox"></ul>
  </div>
  <div id="accountMenu" class="session-menu account-menu" role="dialog" hidden>
    <div id="accountSignedOut">
      <p class="muted" data-i18n="account.why"></p>
      <button type="button" class="primary" id="googleSignInBtn" data-i18n="account.signIn"></button>
    </div>
    <div id="accountSignedIn" hidden>
      <div class="row">
        <img class="avatar large" id="accountMenuAvatar" alt="" referrerpolicy="no-referrer" />
        <div class="account-who">
          <strong id="accountName" dir="auto"></strong>
          <small class="muted" id="accountEmail" dir="ltr"></small>
        </div>
      </div>
      <div class="drive">
        <small class="muted" id="driveStatus" dir="auto"></small>
        <div class="row">
          <button type="button" class="ghost" id="driveBackupBtn" data-i18n="drive.backupNow"></button>
          <button type="button" class="ghost" id="driveRestoreBtn" data-i18n="drive.restore"></button>
        </div>
        <small class="muted" data-i18n="drive.note"></small>
      </div>
      <button type="button" class="ghost" id="googleSignOutBtn" data-i18n="account.signOut"></button>
    </div>
    <small class="muted" id="accountStatus"></small>
  </div>
  <div id="feedbackMenu" class="session-menu feedback-menu" role="dialog" hidden>
    <strong data-i18n="feedback.title"></strong>
    <div class="stars" id="feedbackStars"></div>
    <textarea id="feedbackText" rows="4" dir="auto" data-i18n-placeholder="feedback.placeholder"></textarea>
    <input id="feedbackEmail" type="email" dir="ltr" autocomplete="email" data-i18n-placeholder="feedback.email" />
    <div class="row between">
      <small class="muted" id="feedbackStatus"></small>
      <button type="button" class="primary" id="feedbackSend" data-i18n="feedback.send"></button>
    </div>
  </div>
  <div id="notices" class="notices" aria-live="assertive"></div>

  <main id="chatView">
    <section id="messages" aria-live="polite">
      <div class="empty" id="emptyState">
        <img class="empty-logo" src="../../icons/logo.png" alt="" width="44" height="44" />
        <h2 data-i18n="empty.title"></h2>
        <p data-i18n="empty.body"></p>
        <ul class="examples">
          <li data-i18n="empty.ex1"></li>
          <li data-i18n="empty.ex2"></li>
          <li data-i18n="empty.ex3"></li>
        </ul>
      </div>
    </section>
    <form id="composer">
      <ul id="pending" class="pending" hidden></ul>
      <ul id="fileChips" class="file-chips" hidden></ul>
      <div class="composer-box" id="composerBox">
        <button type="button" class="round" id="attachBtn" data-i18n-title="composer.attach">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48" /></svg>
        </button>
        <input id="fileInput" type="file" multiple hidden />
        <button type="button" class="round" id="voiceToggle" data-i18n-title="composer.voice">
          <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M6 11a6 6 0 0 0 12 0M12 17v4" /></svg>
        </button>
        <textarea id="input" rows="2" dir="auto" data-i18n-placeholder="composer.placeholder"></textarea>
        <button type="button" class="round danger" id="stopBtn" data-i18n-title="composer.stop" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
        </button>
        <button type="submit" class="round primary" id="sendBtn" data-i18n-title="composer.send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
        </button>
      </div>
      <span class="hint" id="hint"></span>
    </form>
  </main>

  <section id="voiceView" class="voice-view" hidden>
    <header class="voice-topbar">
      <button type="button" class="ghost voice-back-btn" id="voiceBackBtn" data-i18n-title="voice.backToChat">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-back"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
        <span data-i18n="voice.backToChat"></span>
      </button>
      <div class="voice-topbar-center">
        <strong class="voice-topbar-title" data-i18n="voice.title"></strong>
      </div>
      <span class="pill voice-pill" id="voiceState" data-i18n="voice.stateIdle"></span>
    </header>

    <div class="voice-hero">
      <button type="button" id="voiceMicBtn" class="voice-mic-btn" aria-label="Microphone" data-i18n-title="composer.voice">
        <span class="voice-mic-circle">
          <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
            <path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
      </button>
      <div id="voiceLive" class="voice-live-text" data-i18n="voice.tapToSpeak"></div>

      <div class="voice-toggles">
        <label class="check voice-toggle">
          <input type="checkbox" id="voiceHandsfree" checked />
          <span data-i18n="voice.handsfree"></span>
        </label>
        <label class="check voice-toggle">
          <input type="checkbox" id="voiceSpeak" />
          <span data-i18n="voice.speak"></span>
        </label>
      </div>
    </div>

    <div id="voiceApproval" class="voice-approval" role="group" aria-live="assertive" hidden></div>

    <div id="voicePending" class="voice-pending" role="note" hidden>
      <strong data-i18n="voice.pendingQuestion"></strong>
      <div id="voicePendingText" class="voice-pending-text" dir="auto"></div>
      <button type="button" id="voicePendingBtn" class="ghost" data-i18n="voice.answerInChat"></button>
    </div>

    <form id="voiceTypedForm" class="voice-typed-form" autocomplete="off">
      <input id="voiceTypedInput" type="text" dir="auto" data-i18n-placeholder="voice.placeholder" />
      <button type="submit" class="round primary" data-i18n-title="composer.send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
      </button>
    </form>

    <div class="voice-log-container">
      <div class="voice-log-header">
        <strong data-i18n="voice.activity"></strong>
        <button type="button" id="voiceClearLog" class="link" data-i18n="voice.clear"></button>
      </div>
      <ol id="voiceLog" class="voice-log-list"></ol>
    </div>
  </section>

  <section id="settingsView" hidden>
    <h2 data-i18n="settings.title"></h2>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabModels" aria-controls="panelModels" aria-selected="true" data-i18n="tabs.models"></button>
      <button type="button" role="tab" id="tabFast" aria-controls="panelFast" aria-selected="false" tabindex="-1" data-i18n="tabs.fast"></button>
    </div>

    <div id="panelModels" role="tabpanel" aria-labelledby="tabModels">
      <div class="card recommended" id="recommended" hidden>
        <strong data-i18n="setup.title"></strong>
        <p class="muted" data-i18n="setup.desc"></p>
        <div class="row between">
          <button type="button" class="primary" id="useRecommended" data-i18n="setup.use"></button>
          <span class="links">
            <a id="keyLinkMain" target="_blank" rel="noopener" data-i18n="setup.keyNvidia"></a>
            <a id="keyLinkBackup" target="_blank" rel="noopener" data-i18n="setup.keyOpenrouter"></a>
          </span>
        </div>
        <p class="muted" id="recommendedNote" data-i18n="setup.applied" hidden></p>
      </div>
      <button type="button" class="link" id="showRecommended" data-i18n="setup.show" hidden></button>
      <fieldset class="frame" data-kind="main">
        <legend><span class="frame-dot"></span><span data-i18n="frame.main"></span></legend>
        <div id="mainProvider" class="fields">
          <label class="field">
            <span data-i18n="settings.provider"></span>
            <select id="provider" data-field="provider">
              <option value="chatgpt" data-i18n="settings.provider.chatgpt"></option>
              <option value="claude" data-i18n="settings.provider.claude"></option>
              <option value="grok" data-i18n="settings.provider.grok"></option>
              <option value="compatible" data-i18n="settings.provider.compatible"></option>
            </select>
          </label>

          <div id="chatgptSection" class="inset" data-field="chatgptSection" data-provider="chatgpt">
            <div class="row between">
              <span data-auth="status"></span>
              <button type="button" data-auth="logout" data-i18n="auth.logout" hidden></button>
            </div>
            <button type="button" class="primary" data-auth="login" data-i18n="auth.login.chatgpt"></button>
            <div class="device" data-auth="device" hidden>
              <p data-i18n="auth.deviceHelp"></p>
              <code data-auth="deviceCode" dir="ltr"></code>
              <div class="row between">
                <a data-auth="deviceLink" target="_blank" rel="noopener" data-i18n="auth.openPage"></a>
                <button type="button" data-auth="cancel" data-i18n="common.cancel"></button>
              </div>
            </div>
            <small class="error" data-auth="message" hidden></small>
            <details>
              <summary data-i18n="auth.importSummary"></summary>
              <p class="muted"><span data-i18n="auth.importRun"></span> <code dir="ltr">codex login</code> <span data-i18n="auth.importThen"></span> <code dir="ltr">~/.codex/auth.json</code> <span data-i18n="auth.importHere"></span></p>
              <textarea id="authJson" rows="4" dir="ltr" placeholder='{"tokens": {...}}'></textarea>
              <button type="button" id="importBtn" data-i18n="auth.import"></button>
            </details>
          </div>

          <div id="claudeSection" class="inset" data-field="claudeSection" data-provider="claude" hidden>
            <div class="row between">
              <span data-auth="status"></span>
              <button type="button" data-auth="logout" data-i18n="auth.logout" hidden></button>
            </div>
            <button type="button" class="primary" data-auth="login" data-i18n="auth.login.claude"></button>
            <div class="device" data-auth="code" hidden>
              <p data-i18n="auth.codeHelp"></p>
              <input data-auth="codeInput" type="text" dir="ltr" autocomplete="off" />
              <button type="button" data-auth="codeSubmit" data-i18n="auth.codeSubmit"></button>
            </div>
            <small class="error" data-auth="message" hidden></small>
            <label class="field">
              <span data-i18n="claude.auth"></span>
              <select data-field="claudeAuth">
                <option value="account" data-i18n="claude.authAccount"></option>
                <option value="apiKey" data-i18n="claude.authApiKey"></option>
              </select>
            </label>
            <label class="field">
              <span data-i18n="claude.apiKey"></span>
              <input data-field="claudeApiKey" type="password" dir="ltr" autocomplete="off" />
            </label>
          </div>

          <div id="grokSection" class="inset" data-field="grokSection" data-provider="grok" hidden>
            <div class="row between">
              <span data-auth="status"></span>
              <button type="button" data-auth="logout" data-i18n="auth.logout" hidden></button>
            </div>
            <button type="button" class="primary" data-auth="login" data-i18n="auth.login.grok"></button>
            <div class="device" data-auth="device" hidden>
              <p data-i18n="auth.deviceHelp"></p>
              <code data-auth="deviceCode" dir="ltr"></code>
              <div class="row between">
                <a data-auth="deviceLink" target="_blank" rel="noopener" data-i18n="auth.openPage"></a>
                <button type="button" data-auth="cancel" data-i18n="common.cancel"></button>
              </div>
            </div>
            <small class="error" data-auth="message" hidden></small>
          </div>

          <div id="compatibleSection" class="fields" data-field="compatibleSection" hidden>
            <label class="field">
              <span data-i18n="compat.preset"></span>
              <select id="preset" data-field="preset"></select>
            </label>
            <label class="field">
              <span>Base URL</span>
              <input id="baseUrl" data-field="baseUrl" dir="ltr" />
            </label>
            <label class="field">
              <span>API Key</span>
              <input id="apiKey" data-field="apiKey" type="password" dir="ltr" autocomplete="off" />
            </label>
          </div>

          <label class="field">
            <span data-i18n="model.label"></span>
            <input id="modelSearch" data-field="modelSearch" type="search" class="model-search" dir="ltr" autocomplete="off" data-i18n-placeholder="model.search" hidden />
            <div class="row">
              <select id="modelSelect" data-field="modelSelect" class="grow"></select>
              <button type="button" class="ghost icon" id="refreshModelsBtn" data-field="refresh" data-i18n-title="model.refresh">↻</button>
            </div>
            <input id="modelInput" data-field="modelInput" dir="ltr" data-i18n-placeholder="model.manual" />
            <small class="muted" id="modelInfo" data-field="modelInfo"></small>
          </label>
          <label class="field">
            <span data-i18n="effort.label"></span>
            <select id="effort" data-field="effort"></select>
          </label>
          <div class="row"><button type="button" class="test-btn" data-field="test" data-i18n="provider.test"></button><small class="muted test-result" data-field="testResult"></small></div>
        </div>
      </fieldset>

      <fieldset class="frame" data-kind="backup">
        <legend><span class="frame-dot"></span><span data-i18n="fallback.title"></span></legend>
        <label class="check switch"><input type="checkbox" id="fallbackEnabled" role="switch" /> <span data-i18n="fallback.enable"></span></label>
        <p class="muted" data-i18n="fallback.desc"></p>
        <div id="fallbackProvider" class="fields">
          <label class="field">
            <span data-i18n="settings.provider"></span>
            <select data-field="provider">
              <option value="chatgpt" data-i18n="settings.provider.chatgpt"></option>
              <option value="claude" data-i18n="settings.provider.claude"></option>
              <option value="grok" data-i18n="settings.provider.grok"></option>
              <option value="compatible" data-i18n="settings.provider.compatible"></option>
            </select>
          </label>
          <p class="muted" data-field="accountNote" data-i18n="fallback.sameLogin" hidden></p>
          <div class="inset" data-field="fallbackAuth" data-provider="" hidden>
            <div class="row between">
              <span data-auth="status"></span>
              <button type="button" data-auth="logout" data-i18n="auth.logout" hidden></button>
            </div>
            <button type="button" class="primary" data-auth="login"></button>
            <div class="device" data-auth="device" hidden>
              <p data-i18n="auth.deviceHelp"></p>
              <code data-auth="deviceCode" dir="ltr"></code>
              <div class="row between">
                <a data-auth="deviceLink" target="_blank" rel="noopener" data-i18n="auth.openPage"></a>
                <button type="button" data-auth="cancel" data-i18n="common.cancel"></button>
              </div>
            </div>
            <div class="device" data-auth="code" hidden>
              <p data-i18n="auth.codeHelp"></p>
              <input data-auth="codeInput" type="text" dir="ltr" autocomplete="off" />
              <button type="button" data-auth="codeSubmit" data-i18n="auth.codeSubmit"></button>
            </div>
            <small class="error" data-auth="message" hidden></small>
          </div>
          <div class="inset" data-field="claudeSection" hidden>
            <label class="field">
              <span data-i18n="claude.auth"></span>
              <select data-field="claudeAuth">
                <option value="account" data-i18n="claude.authAccount"></option>
                <option value="apiKey" data-i18n="claude.authApiKey"></option>
              </select>
            </label>
            <label class="field">
              <span data-i18n="claude.apiKey"></span>
              <input data-field="claudeApiKey" type="password" dir="ltr" autocomplete="off" />
            </label>
          </div>
          <div class="fields" data-field="compatibleSection">
            <label class="field"><span data-i18n="compat.preset"></span><select data-field="preset"></select></label>
            <label class="field"><span>Base URL</span><input data-field="baseUrl" dir="ltr" /></label>
            <label class="field"><span>API Key</span><input data-field="apiKey" type="password" dir="ltr" autocomplete="off" /></label>
          </div>
          <label class="field">
            <span data-i18n="model.label"></span>
            <input data-field="modelSearch" type="search" class="model-search" dir="ltr" autocomplete="off" data-i18n-placeholder="model.search" hidden />
            <div class="row">
              <select data-field="modelSelect" class="grow"></select>
              <button type="button" class="ghost icon" data-field="refresh" data-i18n-title="model.refresh">↻</button>
            </div>
            <input data-field="modelInput" dir="ltr" data-i18n-placeholder="model.manual" />
            <small class="muted" data-field="modelInfo"></small>
          </label>
          <label class="field"><span data-i18n="effort.label"></span><select data-field="effort"></select></label>
          <div class="row"><button type="button" class="test-btn" data-field="test" data-i18n="provider.test"></button><small class="muted test-result" data-field="testResult"></small></div>
        </div>
      </fieldset>

      <div class="card">
        <label class="field">
          <span data-i18n="settings.maxSteps"></span>
          <input id="maxSteps" type="number" min="5" max="300" />
        </label>
        <label class="check"><input type="checkbox" id="vision" /> <span data-i18n="settings.vision"></span></label>
        <label class="check"><input type="checkbox" id="allowJavascript" /> <span data-i18n="settings.javascript"></span></label>
        <label class="check"><input type="checkbox" id="showCursor" /> <span data-i18n="settings.showCursor"></span></label>
        <label class="check"><input type="checkbox" id="notify" /> <span data-i18n="settings.notify"></span></label>
        <p class="muted" id="notifyNote" data-i18n="settings.notifyDenied" hidden></p>
        <label class="field">
          <span data-i18n="settings.steerMode"></span>
          <select id="steerMode">
            <option value="next-step" data-i18n="steer.nextStep"></option>
            <option value="interrupt" data-i18n="steer.interrupt"></option>
            <option value="queue" data-i18n="steer.queue"></option>
          </select>
        </label>
      </div>

      <div class="card">
        <label class="check switch"><input type="checkbox" id="replyLangEnabled" role="switch" /> <strong data-i18n="replyLang.title"></strong></label>
        <p class="muted" data-i18n="replyLang.desc"></p>
        <label class="field" id="replyLangField">
          <span data-i18n="replyLang.label"></span>
          <select id="replyLang">
            <option value="" disabled data-i18n="replyLang.pick"></option>
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>

      <div class="card">
        <strong data-i18n="voice.settingsTitle"></strong>
        <p class="muted" data-i18n="voice.settingsDesc"></p>
        <label class="field">
          <span data-i18n="voice.engine"></span>
          <select id="voiceEngine">
            <option value="postora" data-i18n="voice.enginePostora"></option>
            <option value="fast_only" data-i18n="voice.engineFastOnly"></option>
          </select>
        </label>
        <p class="muted" data-i18n="voice.engineDesc"></p>
      </div>

      <div class="card">
        <strong data-i18n="backup.title"></strong>
        <p class="muted" data-i18n="backup.desc"></p>
        <div class="row">
          <button type="button" id="exportBtn" data-i18n="backup.export"></button>
          <button type="button" id="restoreBtn" data-i18n="backup.restore"></button>
          <input type="file" id="restoreFile" accept="application/json,.json" hidden />
        </div>
        <small class="muted" id="backupResult"></small>
      </div>
    </div>

    <div id="panelFast" role="tabpanel" aria-labelledby="tabFast" hidden>
      <fieldset class="frame" data-kind="fast">
        <legend><span class="frame-dot"></span><span data-i18n="fast.title"></span></legend>
        <label class="check switch"><input type="checkbox" id="fastEnabled" role="switch" /> <span data-i18n="fast.enable"></span></label>
        <p class="muted" data-i18n="fast.desc"></p>
        <div id="fastFields" class="fields">
          <label class="field">
            <span data-i18n="fast.provider"></span>
            <select id="fastProvider"></select>
          </label>
          <label class="field">
            <span data-i18n="fast.mode"></span>
            <select id="fastMode">
              <option value="auto" data-i18n="fast.mode.auto"></option>
              <option value="hints" data-i18n="fast.mode.hints"></option>
            </select>
          </label>
          <label class="field">
            <span>API Key</span>
            <input id="fastApiKey" type="password" dir="ltr" autocomplete="off" />
          </label>
          <label class="field">
            <span data-i18n="model.label"></span>
            <input id="fastModelSearch" type="search" class="model-search" dir="ltr" autocomplete="off" data-i18n-placeholder="model.search" hidden />
            <div class="row">
              <select id="fastModelSelect" class="grow"></select>
              <button type="button" class="ghost icon" id="fastModelsBtn" data-i18n-title="model.refresh">↻</button>
            </div>
            <input id="fastModel" dir="ltr" data-i18n-placeholder="model.manual" />
          </label>
          <label class="field"><span>Base URL</span><input id="fastBaseUrl" dir="ltr" /></label>
          <div class="row">
            <label class="field grow"><span data-i18n="fast.minProb"></span><input id="fastMinProb" type="number" min="0.3" max="0.99" step="0.05" /></label>
            <label class="field grow"><span data-i18n="fast.riskyMax"></span><input id="fastRiskyMax" type="number" min="0.05" max="0.9" step="0.05" /></label>
          </div>
          <div class="row">
            <button type="button" class="test-btn" id="fastTestBtn" data-i18n="fast.test"></button>
            <small class="muted test-result" id="fastTestResult"></small>
          </div>
        </div>
      </fieldset>

      <fieldset class="frame" data-kind="backup" id="fastFallbackFrame">
        <legend><span class="frame-dot"></span><span data-i18n="fast.fallbackTitle"></span></legend>
        <label class="check switch"><input type="checkbox" id="fastFallbackEnabled" role="switch" /> <span data-i18n="fast.fallbackEnable"></span></label>
        <div id="fastFallbackFields" class="fields">
          <label class="field"><span data-i18n="fast.provider"></span><select id="fastFallbackProvider"></select></label>
          <label class="field"><span>API Key</span><input id="fastFallbackApiKey" type="password" dir="ltr" autocomplete="off" /></label>
          <label class="field">
            <span data-i18n="model.label"></span>
            <input id="fastFallbackModelSearch" type="search" class="model-search" dir="ltr" autocomplete="off" data-i18n-placeholder="model.search" hidden />
            <div class="row">
              <select id="fastFallbackModelSelect" class="grow"></select>
              <button type="button" class="ghost icon" id="fastFallbackModelsBtn" data-i18n-title="model.refresh">↻</button>
            </div>
            <input id="fastFallbackModel" dir="ltr" data-i18n-placeholder="model.manual" />
          </label>
          <div class="row"><button type="button" class="test-btn" id="fastFallbackTestBtn" data-i18n="provider.test"></button><small class="muted test-result" id="fastFallbackTestResult"></small></div>
        </div>
      </fieldset>
    </div>


    <p class="error" id="settingsError" hidden></p>
    <div class="row end sticky-actions">
      <button type="button" id="closeSettingsBtn" data-i18n="common.back"></button>
      <button type="button" class="primary" id="saveBtn" data-i18n="common.save"></button>
    </div>
  </section>

  <script type="module" src="panel.js"></script>
</body>
</html>
